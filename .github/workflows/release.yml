name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Exe resources (icon, version info, manifest)
        run: |
          go install github.com/tc-hib/go-winres@latest
          cd cmd/cleaninstaller
          go-winres make --arch amd64 --in winres/winres.json --out rsrc --product-version "$VERSION" --file-version "$VERSION"
      - name: Build
        # Deliberately no UPX and no -s -w: packed or stripped binaries look
        # suspicious to antivirus heuristics.
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-H windowsgui -X main.version=$VERSION" -o dist/CleanInstaller.exe ./cmd/cleaninstaller
      # SignPath signing (enable after SignPath Foundation approval):
      # https://docs.signpath.io/trusted-build-systems/github
      # - uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: <id>
      #     project-slug: CleanInstaller
      #     signing-policy-slug: release-signing
      #     github-artifact-id: <artifact id>
      #     wait-for-completion: true
      #     output-artifact-directory: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/CleanInstaller.exe
